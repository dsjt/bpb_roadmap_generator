<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPB ロードマップジェネレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>BPB ロードマップジェネレーター</h1>
    <div class="header-right">
      <div class="round-control">
        <label for="round-count-input">ラウンド数</label>
        <input type="number" id="round-count-input" min="1" max="18" value="10" step="1">
      </div>
      <div class="header-actions">
        <button id="btn-import-json" class="btn">📂 読み込み</button>
        <button id="btn-export-json" class="btn">💾 保存</button>
        <button id="btn-share" class="btn">🔗 URLをコピー</button>
        <button id="btn-export" class="btn btn-primary">⬇ PNG保存</button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside class="palette-panel">
      <div class="palette-top">
        <input id="palette-search" type="text" placeholder="アイテムを検索…" autocomplete="off">
        <div id="rarity-filter" class="rarity-filter">
          <button class="rarity-btn active" data-rarity="">全て</button>
          <button class="rarity-btn" data-rarity="common">コモン</button>
          <button class="rarity-btn" data-rarity="rare">レア</button>
          <button class="rarity-btn" data-rarity="epic">エピック</button>
          <button class="rarity-btn" data-rarity="legendary">レジェンダリ</button>
          <button class="rarity-btn" data-rarity="god">ゴッド</button>
          <button class="rarity-btn" data-rarity="unique">ユニーク</button>
        </div>
        <div class="palette-btns">
          <button id="btn-add-custom" class="btn btn-sm">＋ カスタム</button>
        </div>
      </div>
      <ul id="palette-list" class="palette-list"></ul>
    </aside>

    <div class="canvas-area">
      <div class="canvas-scroll">
        <div id="roadmap-canvas" class="roadmap-canvas">
          <div id="roadmap-blocks"></div>
        </div>
        <div class="canvas-footer">
          <button id="btn-add-roadmap" class="btn btn-sm">＋ ロードマップを追加</button>
          <button id="btn-select-all" class="btn btn-sm">全て解除</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="items.js"></script>
  <script src="script.js"></script>
</body>
</html>
